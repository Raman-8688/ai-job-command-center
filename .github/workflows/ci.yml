name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-docs-and-configs:
    name: Validate Docs and Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Secret Leaks Avoided
        run: |
          echo "Verifying no live .env or credential tokens are committed..."
          if git status --porcelain | grep -E "\.env$|\.key$|\.pem$"; then
            echo "Secret file detected!"
            exit 1
          fi
          echo "Secret check passed."

      - name: Verify Documentation Structure
        run: |
          test -f docs/PROJECT_MASTER_PLAN.md || exit 1
          test -f README.md || exit 1
          test -f .env.example || exit 1
          echo "Core documentation validated."
