spring:
  datasource:
    url: jdbc:h2:mem:job_command_center_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    com.jobcommandcenter: DEBUG
    org.springframework.security: WARN
    org.flywaydb: INFO

app:
  google:
    client-id: test-client-id
    client-secret: test-client-secret
  ai:
    provider: TEST
    api-key: test-key
  storage:
    path: ./target/test-storage
