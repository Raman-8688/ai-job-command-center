<main class="command-center-container">
  <header class="navbar">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <h1>{{ title }}</h1>
    </div>
    <div class="nav-tabs">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'assessments'"
        (click)="activeTab = 'assessments'">
        ⏱️ Online Assessments
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'company-intel'"
        (click)="activeTab = 'company-intel'">
        🏢 Company Intel
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'interviews'"
        (click)="activeTab = 'interviews'">
        📅 Interview Cockpit
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'prep'"
        (click)="activeTab = 'prep'">
        🧠 AI Prep & Simulation
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'applications'"
        (click)="activeTab = 'applications'">
        📋 Applications
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'tailoring'"
        (click)="activeTab = 'tailoring'">
        📄 Resume Tailoring
      </button>
    </div>
    <span class="badge">{{ status }}</span>
  </header>

  <section class="workbench-wrapper">
    <app-assessment-tracker
      *ngIf="activeTab === 'assessments'"
      (openCompanyIntel)="navigateToCompanyIntel($event)">
    </app-assessment-tracker>

    <app-company-dossier
      *ngIf="activeTab === 'company-intel'"
      [initialJobId]="selectedJobIdForIntel">
    </app-company-dossier>

    <app-interview-cockpit
      *ngIf="activeTab === 'interviews'"
      (openPrep)="navigateToPrep($event)">
    </app-interview-cockpit>

    <app-interview-prep-workspace
      *ngIf="activeTab === 'prep'"
      [interviewId]="selectedInterviewIdForPrep"
      (backToCockpit)="returnToCockpit()">
    </app-interview-prep-workspace>

    <app-application-tracker
      *ngIf="activeTab === 'applications'">
    </app-application-tracker>

    <app-tailored-resume-workbench
      *ngIf="activeTab === 'tailoring'">
    </app-tailored-resume-workbench>
  </section>
</main>
